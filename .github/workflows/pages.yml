# main に push されたら、公開サイトのファイルだけを GitHub Pages に公開する。
# 公開するファイルは tools/site_files.py の許可リストで決める（tools/ や README.md は公開しない）。
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # データの更新日（meta.json）を git の履歴から調べるため、全履歴を取る
      - name: 許可リストのテスト（ubuntu-latest に入っている python3 を使う）
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: ページの動きのテスト（ubuntu-latest に入っている Google Chrome を使う）
        run: python3 -m unittest discover -s tests -v
        env:
          REQUIRE_BROWSER: "1"
      - name: 公開ファイルを集める
        run: python3 tools/build_site.py _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
