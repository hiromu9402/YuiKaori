# PR を出したとき（と、PR のブランチに push したとき）に、公開の仕組みとページの動きのテストを実行する。
# main に push されたときは pages.yml が同じテストを実行してから公開する。
name: Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # データの更新日（meta.json）を git の履歴から調べるため、全履歴を取る
      - name: 許可リストのテスト（ubuntu-latest に入っている python3 を使う）
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: ページの動きのテスト（ubuntu-latest に入っている Google Chrome を使う）
        run: python3 -m unittest discover -s tests -v
        env:
          REQUIRE_BROWSER: "1"
