<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events Calendar</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th,
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        .artist1 {
            color: hotpink;
        }
        .artist2 {
            color: deepskyblue;
        }
        .artist3 {
            color: orange;
        }
    </style>
    <link rel="stylesheet" href="common.css">
</head>

<body>
<nav class="gnav"><a class="brand" href="index.html">ゆいかおり DB</a><a href="index.html">楽曲一覧</a><a href="tour.html">ツアー比較</a><a href="event.html">イベント検索</a><a href="calendar.html" class="on">カレンダー</a><span class="group"><a href="my.html">唯ソロ</a><a href="my_c.html">夏織ソロ</a><a href="my_f.html">ゆいかおり</a></span></nav>
    <h2>ゆいかおりカレンダー</h2>
    <div class="table-wrap">
    <table id="eventsTable">
        <thead>
            <tr>
                <th>日付</th>
                <th>イベントタイトル</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    </div>

    <script>
        fetch('event.json')
            .then(response => response.json())
            .then(data => {
                const eventsTable = document.getElementById('eventsTable');
                const tbody = eventsTable.getElementsByTagName('tbody')[0];
                const maxday = new Array(31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31);

                for (let i = 1; i <= 12; i++) {
                    for (let j = 1; j <= maxday[i - 1]; j++) {
                        const events = data.filter(event => event.Month === String(i) && event.Day === String(j));

                        const row = tbody.insertRow();
                        const dateCell = row.insertCell(0);
                        const titleCell = row.insertCell(1);

                        dateCell.textContent = i + '月' + j + '日';
                        events.forEach((event, index) => {
                            let artistClass = '';
                            if (Array.isArray(event.Artist)) {
                                if (event.Artist.length > 0) {
                                    if (event.Artist[0] === '小倉唯') {
                                        artistClass = 'artist1';
                                    } else if (event.Artist[0] === '石原夏織') {
                                        artistClass = 'artist2';
                                    } else if (event.Artist[0] === 'ゆいかおり') {
                                        artistClass = 'artist3';
                                    }
                                }
                            } else {
                                if (event.Artist === '小倉唯') {
                                    artistClass = 'artist1';
                                } else if (event.Artist === '石原夏織') {
                                    artistClass = 'artist2';
                                } else if (event.Artist === 'ゆいかおり') {
                                    artistClass = 'artist3';
                                }
                            }
                            if (event.class1 === 'リリース') {
                                release1 = event.class2 + '「';
                                release2 = '」リリース';
                            } else {
                                release1 = '';
                                release2 = '';
                            }
                            titleCell.innerHTML += `<span class="${artistClass}">${release1}${event.title}${release2} (${event.Year}年)</span>` + (index < events.length - 1 ? '<br>' : '');
                        });
                    }
                }
            })
            .catch(error => console.error('Error fetching events data: ', error));
    </script>
<script src="table-zoom.js"></script>
</body>

</html>
