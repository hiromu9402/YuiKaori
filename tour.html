<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ツアーセットリスト比較ページ</title>
  <style>
    th, td { border: 1px solid #ccc; text-align: center; }
    .cyan { background-color: cyan; }
    .orange { background-color: orange; }
    .pink { background-color: pink; }
  </style>
    <link rel="stylesheet" href="common.css">
</head>
<body>
<nav class="gnav"><a class="brand" href="index.html">ゆいかおり DB</a><a href="songs.html">楽曲一覧</a><a href="tour.html" class="on">ツアー比較</a><a href="event.html">イベント検索</a><a href="calendar.html">カレンダー</a><span class="group"><a href="my.html">唯ソロ</a><a href="my_c.html">夏織ソロ</a><a href="my_f.html">ゆいかおり</a></span></nav>
  <h1>ツアーセットリスト比較ページ</h1>
  <label for="tourSelect">ツアー名を選択：</label>
  <select id="tourSelect"></select>
  <p class="hint">色の付いた行は、公演によって曲が違うところです。曲名を押すと、その曲を披露した公演の一覧が開きます。</p>
  <table id="concertTable"></table>
  <div class="container table-wrap" id="setlistContainer"></div>

  <script src="common.js"></script>
  <script>
    const concertTable = document.getElementById('concertTable');
    const tourSelect = document.getElementById('tourSelect');
    const setlistContainer = document.getElementById('setlistContainer');
    renderTourOptions(tourSelect);

    const formatSong = (song) => {
      if (!song) return '';
      if (typeof song === 'object' && song.medley) {
        return `<span class="medley-label">【メドレー】</span><br>` +
          song.medley.map(track =>
            `<span class="med"><a href="./sub/search.html?name=${encodeURIComponent(track)}">${track}</a></span>`
          ).join('<br>');
      }
      return `<a href="./sub/search.html?name=${encodeURIComponent(song)}">${song}</a>`;
    };

    const applyCell = (row, value, isSame, selectedTour) => {
      const cell = row.insertCell();
      cell.innerHTML = value;
      cell.style.whiteSpace = 'pre-wrap';
      if (!isSame) {
        if (selectedTour.includes('石原夏織')) {
          row.classList.add('cyan');
        } else if (selectedTour.includes('ゆいかおり')) {
          row.classList.add('orange');
        } else {
          row.classList.add('pink');
        }
      }
    };

    tourSelect.addEventListener('change', () => {
      setlistContainer.innerHTML = '';
      concertTable.innerHTML = '';

      const selectedTour = tourSelect.value;
      if (!selectedTour) return;

      fetch('setlist.json')
        .then(response => response.json())
        .then(data => {
          const concerts = data.filter(item => item.tourtitle === selectedTour);
          concerts.sort((a, b) => a.id.localeCompare(b.id));

          const maxSetlistLength = Math.max(...concerts.map(c => c.setlist.length));
          const maxEncoreLength = Math.max(...concerts.map(c =>
            Array.isArray(c.encore) ? c.encore.length : (c.encore ? 1 : 0)
          ));

          concerts.forEach(c => {
            while (c.setlist.length < maxSetlistLength) c.setlist.push('');

            if (!Array.isArray(c.encore)) c.encore = c.encore ? [c.encore] : [];
            while (c.encore.length < maxEncoreLength) c.encore.push('');

            if (!Array.isArray(c.Wencore)) c.Wencore = c.Wencore ? [c.Wencore] : [];
          });

          const table = document.createElement('table');
          table.className = 'compare';

          const headerRow = table.insertRow();
          headerRow.className = 'head';
          headerRow.insertCell().textContent = '';
          concerts.forEach(concert =>
            headerRow.insertCell().textContent =
            concert.LIVEtitle.replace(concert.tourtitle, '')
          );

          const dateRow = table.insertRow();
          dateRow.className = 'meta';
          dateRow.insertCell().textContent = '開催日';
          concerts.forEach(c => dateRow.insertCell().textContent = c.date);

          const venueRow = table.insertRow();
          venueRow.className = 'meta';
          venueRow.insertCell().textContent = '会場';
          concerts.forEach(c => venueRow.insertCell().textContent = c.venue);

          const setHeader = table.insertRow();
          setHeader.className = 'sec';
          setHeader.insertCell().textContent = '';
          concerts.forEach(() => setHeader.insertCell().textContent = '【セットリスト】');

          for (let i = 0; i < maxSetlistLength; i++) {
            const row = table.insertRow();
            row.insertCell().textContent = i + 1;

            const setlistValues = concerts.map(c => formatSong(c.setlist[i]));
            const isSame = setlistValues.every((v, _, arr) => v === arr[0]);

            setlistValues.forEach(v => applyCell(row, v, isSame, selectedTour));
          }

          const encoreList = concerts.map(c => c.encore);

          if (maxEncoreLength > 0) {
            const encHeader = table.insertRow();
            encHeader.className = 'sec';
            encHeader.insertCell().textContent = '';
            concerts.forEach(() => encHeader.insertCell().textContent = '【アンコール】');

            for (let i = 0; i < maxEncoreLength; i++) {
              const row = table.insertRow();
              row.insertCell().textContent = 'EC' + (i + 1);

              const encoreValues = encoreList.map(enc => formatSong(enc[i]));
              const isSame = encoreValues.every((v, _, arr) => v === arr[0]);

              encoreValues.forEach(v => applyCell(row, v, isSame, selectedTour));
            }
          }

          const wencoreList = concerts.map(c => c.Wencore);
          const maxWencore = Math.max(...wencoreList.map(w => w.length));

          if (maxWencore > 0) {

            const wencoreHeader = table.insertRow();
            wencoreHeader.className = 'sec';
            wencoreHeader.insertCell().textContent = '';

            concerts.forEach((concert, idx) => {
              if (wencoreList[idx].some(item => item && item !== '')) {
                wencoreHeader.insertCell().textContent = '【ダブルアンコール】';
              } else {
                wencoreHeader.insertCell().textContent = '';
              }
            });

            for (let i = 0; i < maxWencore; i++) {
              const row = table.insertRow();
              row.insertCell().textContent = 'WEC' + (i + 1);

              const wencoreValues = wencoreList.map(w => formatSong(w[i] || ''));
              const isSame = wencoreValues.every((v, _, arr) => v === arr[0]);

              wencoreValues.forEach(v => applyCell(row, v, isSame, selectedTour));
            }
          }

          setlistContainer.appendChild(table);
        });
    });
  </script>
<script src="table-zoom.js"></script>
<script src="site.js"></script>
</body>

</html>
