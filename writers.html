<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作家から探す</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<nav class="gnav"><a class="brand" href="index.html">ゆいかおり DB</a><a href="songs.html">楽曲一覧</a><a href="writers.html" class="on">作家</a><a href="tour.html">ツアー比較</a><a href="event.html">イベント検索</a><a href="calendar.html">カレンダー</a><span class="group"><a href="my.html">唯ソロ</a><a href="my_c.html">夏織ソロ</a><a href="my_f.html">ゆいかおり</a></span></nav>
<h1>作家から探す</h1>
<p class="hint">楽曲一覧の曲の作詞・作曲・編曲を、作家ごとにまとめています。名前を押すと、その作家の曲の一覧が開きます。所属などのかっこ書きが違う表記は、同じ作家としてまとめています。</p>
<div class="artist-tabs" id="artistTabs">
    <input type="radio" id="w-all" name="writer-artist" value="" checked class="radio-input">
    <label for="w-all" class="radio-label">すべて</label>
    <input type="radio" id="w-yui" name="writer-artist" value="小倉唯" class="radio-input">
    <label for="w-yui" class="radio-label yui">唯ソロ</label>
    <input type="radio" id="w-kaori" name="writer-artist" value="石原夏織" class="radio-input">
    <label for="w-kaori" class="radio-label kaori">夏織ソロ</label>
    <input type="radio" id="w-yuikaori" name="writer-artist" value="ゆいかおり" class="radio-input">
    <label for="w-yuikaori" class="radio-label yuikaori">ゆいかおり</label>
</div>
<div class="song-tools">
    <input type="search" id="writerSearch" placeholder="作家の名前で絞り込む" aria-label="作家の絞り込み">
    <span id="writerCount"></span>
</div>
<div class="table-wrap">
<table id="writerTable">
    <thead><tr><th>作家</th><th>曲数</th><th>作詞</th><th>作曲</th><th>編曲</th></tr></thead>
    <tbody></tbody>
</table>
</div>
<script src="writer.js"></script>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let allSongs = [];

function render() {
    const artist = document.querySelector('input[name="writer-artist"]:checked').value;
    const words = document.getElementById('writerSearch').value.trim().normalize('NFKC').toLowerCase().split(/\s+/).filter(Boolean);
    const songs = artist ? allSongs.filter(s => s.artist === artist) : allSongs;
    const writers = [...YKWriters.collectWriters(songs).values()];
    const count = (w, label) => w.songs.filter(x => x.roles.includes(label)).length;
    writers.sort((a, b) => b.songs.length - a.songs.length || a.name.localeCompare(b.name, 'ja'));
    const shown = writers.filter(w => {
        const text = [w.name, ...w.forms].join(' ').normalize('NFKC').toLowerCase();
        return words.every(word => text.includes(word));
    });
    document.querySelector('#writerTable tbody').innerHTML = shown.map(w => `<tr>
        <td><a href="sub/writer.html?name=${encodeURIComponent(w.name)}">${esc(w.name)}</a></td>
        <td>${w.songs.length}</td><td>${count(w, '作詞') || ''}</td><td>${count(w, '作曲') || ''}</td><td>${count(w, '編曲') || ''}</td>
    </tr>`).join('');
    document.getElementById('writerCount').textContent = words.length ? `${shown.length} / ${writers.length}人` : `${writers.length}人`;
}

fetch('song.json').then(r => r.json()).then(songs => {
    allSongs = songs;
    document.querySelectorAll('input[name="writer-artist"]').forEach(r => r.addEventListener('change', render));
    document.getElementById('writerSearch').addEventListener('input', render);
    render();
}).catch(error => {
    console.error(error);
    document.querySelector('#writerTable tbody').innerHTML = '<tr><td colspan="5">データを読み込めませんでした。</td></tr>';
});
</script>
<script src="table-zoom.js"></script>
<script src="site.js"></script>
</body>
</html>
